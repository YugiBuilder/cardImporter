# FIXED: Configuration de test pour MongoDB embedded
# Fichier: src/test/resources/application-test.properties

# Force le profil test
spring.profiles.active=test

# MongoDB Embedded - VERSION OBLIGATOIRE compatible Spring Boot 3.4!
de.flapdoodle.embed.mongo.version=6.0.6

# Configuration MongoDB pour tests
spring.data.mongodb.database=yugioh_test

# CORRECTION PRINCIPALE: URI MongoDB valide pour les tests
spring.data.mongodb.uri=mongodb://localhost:27017/yugioh_test

# API de test
ygoprodeck.api.url=https://db.ygoprodeck.com/api/v7/cardinfo.php

# Configuration permettant l'override des beans (CRUCIAL pour les tests)
spring.main.allow-bean-definition-overriding=true

# Serveur sur port aléatoire pour les tests
server.port=0

# Désactiver la bannière Spring Boot pour les tests
spring.main.banner-mode=off

# Désactiver les runners au démarrage pour les tests
app.import-cards-on-startup=false

# Configuration des logs pour les tests
logging.level.org.mongodb.driver=WARN
logging.level.de.flapdoodle.embed.mongo=WARN
logging.level.org.springframework.test=DEBUG
logging.level.com.yugibuilder.cardimporter=DEBUG
logging.level.root=INFO

# Désactiver les métriques non nécessaires pour les tests
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# Configuration JPA/MongoDB optimisée pour tests
spring.data.mongodb.auto-index-creation=true

# Configuration cache désactivée pour tests
spring.cache.type=none
