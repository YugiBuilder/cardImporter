# FIXED: Application Properties with Swagger Configuration and Exception Handler Support

spring.application.name=cardImporter

# YGOProDeck API configuration
ygoprodeck.api.url=https://db.ygoprodeck.com/api/v7/cardinfo.php

# Server configuration
server.port=${SERVER_PORT:8080}

# Error handling (from previous circular view path fix)
server.error.whitelabel.enabled=false
server.error.path=/custom-error

# MongoDB configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://your_username:your_password@localhost:27017/yugioh_db?authSource=yugioh_db}

# Profile configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Logging configuration
logging.level.org.springframework.data.mongodb=${MONGODB_LOG_LEVEL:DEBUG}
logging.level.com.yugibuilder.cardimporter=${LOG_LEVEL:DEBUG}

# Redis cache configuration (optional)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Application-specific configuration
app.import-cards-on-startup=${IMPORT_CARDS_ON_STARTUP:false}

# MongoDB connection timeout settings
spring.data.mongodb.option.connect-timeout=30000
spring.data.mongodb.option.socket-timeout=30000
spring.data.mongodb.option.server-selection-timeout=30000

# ==========================================
# SWAGGER/OPENAPI 3 CONFIGURATION - FIXED
# ==========================================

# Enable Swagger UI and API docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Custom Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# API docs path
springdoc.api-docs.path=/v3/api-docs

# Swagger UI configuration options
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true

# FIXED: Disable generic error responses from @ControllerAdvice
# This prevents the 500 error caused by SpringDoc trying to document exception handlers
springdoc.override-with-generic-response=false

# Support both JSON and YAML formats
springdoc.api-docs.format=yaml

# Show actuator endpoints in Swagger (optional)
springdoc.show-actuator=false

# Package scanning configuration (optional - restrict to your controllers)
# springdoc.packagesToScan=com.yugibuilder.cardimporter.controller

# Path matching configuration (optional - restrict to specific paths)
# springdoc.pathsToMatch=/cards/**