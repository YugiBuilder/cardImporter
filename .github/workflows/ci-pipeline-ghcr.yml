name: CI/CD Spring Boot

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# =====================================================
# BUILD + TESTS + QUALITÉ
# =====================================================
jobs:

  build-test:
    name: Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build + Tests
        run: ./mvnw clean verify -P integration-tests
        env:
          SPRING_PROFILES_ACTIVE: test
          IMPORT_CARDS_ON_STARTUP: false

      - name: OWASP Dependency Check
        run: ./mvnw dependency-check:check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/dependency-check-report.html

  # =====================================================
  #  DOCKER BUILD + PUSH GHCR
  # =====================================================

  docker:
    name: Docker Build & Push GHCR
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime

      - name: Scan Docker Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif

  # =====================================================
  #  DEPLOY (OPTIONNEL)
  # =====================================================

  deploy:
    name: Deploy Info
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: 🚀 Deployment Info
        run: |
          echo "🎉 Application pushed to GitHub Container Registry!"
          echo "📦 Image available at:"
          echo "ghcr.io/${{ github.repository }}:latest"

  # =====================================================
  #  CLEANUP & NOTIFICATIONS
  # =====================================================

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [build-test, docker]
    if: always()

    steps:
      - name: Cleanup complete
        run: echo "Pipeline finished"

      - name: Failure
        if: failure()
        run: echo "Pipeline failed"

      - name: Success
        if: success()
        run: echo "Pipeline succeeded"
